# Monthly, grouped update pull requests for the pinned GitHub Actions and Python packages.
# Each pull request runs the full test suite and the security checks before anything is merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-packages:
        patterns: ["*"]
